[project]
name = "workaholic-api"
version = "0.1.0"
description = "Workaholic backend API and background workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10,<4",
    "alembic>=1.20,<2",
    "asyncpg>=0.31,<0.32",
    "azure-identity>=1.25,<2",
    "celery[redis]>=5.6,<5.7",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "jinja2>=3.1,<4",
    "openai>=2,<3",
    "playwright>=1.56,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt[crypto]>=2.14,<3",
    "python-multipart>=0.0.20,<0.1",
    "redis>=6.4,<7",
    "sentry-sdk[fastapi]>=2.69,<3",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "structlog>=26.1,<27",
    "uvicorn[standard]>=0.53,<0.54",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "celery-types>=0.26.0",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "C4", "SIM", "PT", "N"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "pdf: prints real PDFs with Chromium (needs `uv run playwright install chromium`)",
]
